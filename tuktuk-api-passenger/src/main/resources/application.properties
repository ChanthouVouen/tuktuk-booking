spring.application.name=tuktuk-api-passenger
server.port=8081

# Swagger / OpenAPI UI: http://localhost:8081/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:25060/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

# ddl-auto=update is convenient for development; use migrations (e.g. Flyway) in production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT - override tuktuk.jwt.secret via env var in any real deployment
tuktuk.jwt.secret=${JWT_SECRET:tuktuk-passenger-dev-secret-key-change-me-before-production-2026}
tuktuk.jwt.expiration-ms=86400000
