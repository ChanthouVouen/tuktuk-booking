spring.application.name=tuktuk-api-driver
server.port=8082

# Swagger / OpenAPI UI: http://localhost:8082/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:25060/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

# ddl-auto=update is convenient for development; use migrations (e.g. Flyway) in production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT - override tuktuk.jwt.secret via env var in any real deployment
tuktuk.jwt.secret=${JWT_SECRET:tuktuk-driver-dev-secret-key-change-me-before-production-2026}
tuktuk.jwt.expiration-ms=86400000

# Bakong Open API (KHQR payment verification) - https://api-bakong.nbc.gov.kh
# Get a renewable token from the Bakong Developer Portal (https://developer.bakong.nbc.gov.kh)
# and set it via a real env var. The payee account/name are NOT configured here - each KHQR
# is generated against the receiving driver's own bakongAccountId (set at driver registration/update),
# so payment goes straight to that driver rather than a shared platform account.
tuktuk.bakong.api-url=${BAKONG_API_URL:https://api-bakong.nbc.gov.kh}
tuktuk.bakong.token=${BAKONG_TOKEN:}
tuktuk.bakong.merchant.city=${BAKONG_MERCHANT_CITY:PHNOM PENH}
tuktuk.bakong.merchant.acquiring-bank=${BAKONG_ACQUIRING_BANK:}

tuktuk.payment.expiry-minutes=${PAYMENT_EXPIRY_MINUTES:15}
tuktuk.payment.default-currency=${PAYMENT_CURRENCY:USD}
